apiVersion: batch/v1
kind: Job
metadata:
  name: bench
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bench
          image: python:3.12-slim
          workingDir: /work
          env:
            - {name: TARGET, value: "http://sim:8000"}   # the server to test
            - {name: RUN_NAME, value: "kind-test"}       # results folder name
            - {name: USERS, value: "1 2"}                # load levels
            - {name: DURATION, value: "30"}              # seconds per level
            - {name: TOOLS, value: "off"}                # send tool definitions?
            - {name: QUALITY, value: "off"}              # run the tool-call check?
            - {name: LAYOUT, value: "good"}
            - {name: TRACES, value: "/work/traces.json"}
            - {name: EVAL_SET, value: "/evaldata/eval_set.jsonl"}
          command: ["bash", "-c"]
          args:
            - |
              pip install -q openai
              mkdir -p /results/$RUN_NAME
              python replay.py $TARGET 4 60 /tmp/warmup.jsonl    # warm-up, not kept
              for u in $USERS; do
                python replay.py $TARGET $u $DURATION /results/$RUN_NAME/users_$u.jsonl
              done
              if [ "$QUALITY" = "on" ]; then
                python tool_eval.py $TARGET > /results/$RUN_NAME/quality.txt
              fi
              echo DONE
              sleep 1800    # keeps the pod alive so you can copy the results
          volumeMounts:
            - {name: code, mountPath: /work}
            - {name: evaldata, mountPath: /evaldata}
            - {name: results, mountPath: /results}
      volumes:
        - {name: code, configMap: {name: bench-code}}
        - {name: evaldata, configMap: {name: bench-eval}}
        - {name: results, emptyDir: {}}