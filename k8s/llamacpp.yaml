apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp
  labels: {app: llamacpp}
spec:
  replicas: 1
  selector:
    matchLabels: {app: llamacpp}
  template:
    metadata:
      labels: {app: llamacpp}
    spec:
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: llamacpp
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          args:
            - "-hf"
            - "ggml-org/gemma-4-E4B-it-GGUF:Q8_0"   # downloads the 8-bit GGUF file
            - "--jinja"                             # applies Gemma 4's chat template
            - "--reasoning"
            - "off"
            - "-ngl"
            - "999"                                 # puts every layer on the GPU
            - "-np"
            - "16"                                  # 16 request slots
            - "-c"
            - "131072"                              # total context: 8,192 tokens per slot
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          env:
            - name: HF_TOKEN
              valueFrom: {secretKeyRef: {name: hf-token, key: HF_TOKEN}}
          ports: [{containerPort: 8000, name: http}]
          resources:
            limits: {nvidia.com/gpu: 1}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            failureThreshold: 90
---
apiVersion: v1
kind: Service
metadata:
  name: llamacpp
spec:
  selector: {app: llamacpp}
  ports: [{port: 8000, targetPort: 8000, name: http}]